# Electron Builder configuration (macOS, one DMG each for Apple Silicon and Intel).
# Signed with the Developer ID in the login keychain and notarized when APPLE_KEYCHAIN_PROFILE
# (or APPLE_ID + APPLE_APP_SPECIFIC_PASSWORD + APPLE_TEAM_ID) is set. See README for setup.
appId: com.mnismt.keepanything
productName: KeepAnything
copyright: Copyright © 2026 mnismt
electronLanguages: [en]
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
  - '!**/*.map'
  # The browser build of onnxruntime is never used (the worker runs onnxruntime-node).
  - '!**/node_modules/onnxruntime-web/**'
# Native binaries must stay real files on disk: they are dlopen'ed and cannot live inside the asar.
asarUnpack:
  - '**/node_modules/onnxruntime-node/**'
  - '**/node_modules/sharp/**'
  - '**/node_modules/@img/**'
# Embedding model files fetched by `pnpm run models:fetch`; seeded into <userData>/models on first launch.
extraResources:
  - from: build/models
    to: models
  # Drag-watch sidecar built by `pnpm run native`; absent when swiftc was unavailable.
  - from: build/native
    to: native
asar: true
npmRebuild: false
mac:
  category: public.app-category.productivity
  icon: build/icon.icns
  # Separate DMGs, not a universal build: the model and onnxruntime would double a fat bundle's size.
  # ponytail: both archs' sharp/onnxruntime binaries ship in each DMG (~30 MB); per-arch `files` excludes if it matters.
  target:
    - target: dmg
      arch: [arm64, x64]
  artifactName: ${productName}-${version}-${arch}.${ext}
  hardenedRuntime: true
  # Without this a missing identity is a warning, not an error, and the .dmg ships unsigned.
  forceCodeSigning: true
  # `spctl --assess` runs right after signing, before notarization, so it would always fail here.
  gatekeeperAssess: false
  darkModeSupport: true
  extendInfo:
    NSHumanReadableCopyright: Copyright © 2026 mnismt
dmg:
  sign: false
