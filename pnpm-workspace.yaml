# pnpm 11 reads its settings from this file (`.npmrc` is only used for registry/auth).
# Hoisted layout: electron-builder needs a real node_modules tree for asarUnpack (onnxruntime-node, sharp).
nodeLinker: hoisted
shamefullyHoist: true
allowBuilds:
  electron: true
  electron-builder: true
  app-builder-bin: true
  esbuild: true
  electron-winstaller: false
  # Prebuilt binaries ship inside the packages; no build step needed (silences pnpm 11 warnings).
  onnxruntime-node: false
  sharp: false
  protobufjs: false
  # simple-git-hooks postinstall writes `.git/hooks/pre-commit` (and friends).
  simple-git-hooks: true
# Added by pnpm: lucide-react 1.40.0 is newer than the default minimum release age.
minimumReleaseAgeExclude:
  - lucide-react@1.40.0
# ONNX Runtime 1.24 dropped the macOS x64 prebuilt; 1.23.2 is the last release with both darwin archs.
# Drop this override once Intel Macs are no longer a target.
overrides:
  onnxruntime-node: 1.23.2
# Install the sharp and onnxruntime binaries for both Mac archs so one node_modules can package both DMGs.
supportedArchitectures:
  os: [darwin]
  cpu: [arm64, x64]
